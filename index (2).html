<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AntriSurat</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f6;--sf:#fff;--ink:#0f1e1c;--mute:#5b6b68;--line:#d6dfdd;--brand:#0f6b5e;--on:#fff;--amb:#f2b705;--ambi:#2a2000;--bad:#b42318;--ok:#067647;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1514;--sf:#142220;--ink:#e8f1ef;--mute:#9bb0ac;--line:#27403c;--brand:#3fc2ac;--on:#05211c;--bad:#ff8a7a;--ok:#5fd59a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1514;--sf:#142220;--ink:#e8f1ef;--mute:#9bb0ac;--line:#27403c;--brand:#3fc2ac;--on:#05211c;--bad:#ff8a7a;--ok:#5fd59a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;line-height:1.1;margin:0}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px;flex-wrap:wrap}
.logo{font:800 22px "Bricolage Grotesque",sans-serif;color:var(--brand)}
.who{font-size:14px;color:var(--mute);display:flex;gap:10px;align-items:center}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--sf);border-radius:8px;padding:9px 14px;font-weight:600}
button.p{background:var(--brand);color:var(--on);border-color:var(--brand)}
button.d{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sf)}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;color:var(--mute);white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--brand)}
.ticket{position:relative;background:var(--amb);color:var(--ambi);border-radius:14px;padding:22px 26px;text-align:center}
.ticket:before,.ticket:after{content:"";position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
.ticket:before{left:-11px}.ticket:after{right:-11px}
.ticket small{display:block;font-weight:600;opacity:.8}
.num{font:800 clamp(56px,14vw,96px)/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.bad{color:var(--bad);border-color:var(--bad)}
.mute{color:var(--mute);font-size:14px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.steps{display:flex;gap:4px;margin:10px 0 4px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--brand)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.bar b{display:block;height:100%;background:var(--brand)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:9}
.hero{display:grid;gap:24px;grid-template-columns:1.1fr .9fr;align-items:center;margin-top:8px}
@media(max-width:720px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(32px,6vw,52px);margin-bottom:12px}
.stat{font:800 34px "Bricolage Grotesque",sans-serif}
.hint{font-size:13px;color:var(--mute);margin-top:10px}
@media(prefers-reduced-motion:no-preference){.ticket{animation:pop .5s ease-out}@keyframes pop{from{transform:rotate(-3deg) scale(.96)}}}
</style></head><body><div class="wrap">
<header><div class="logo">AntriSurat</div><div class="who" id="who"></div></header>
<main id="app"></main>
<p class="hint">Data demo tersimpan di peramban ini. <button id="reset" style="padding:3px 8px;font-size:12px">Atur ulang data demo</button></p>
</div><script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K='antrisurat-v1',JENIS=['Surat Keterangan Domisili','Surat Keterangan Tidak Mampu','Surat Keterangan Usaha','Pengantar KTP/KK','Pengantar Nikah'],FLOW=['Diajukan','Diverifikasi','Diproses','Selesai'];
let mem=null,me=null,tab='',db=load(),toastT;
const pad=n=>String(n).padStart(3,'0'),fmt=t=>new Date(t).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
function seed(){const n=Date.now(),m=60000;return{users:[{u:'warga',p:'warga123',role:'warga',name:'Siti Rahma'},{u:'petugas',p:'petugas123',role:'petugas',name:'Pak Budi (Petugas)'}],
letters:[{id:'SRT-0001',u:'warga',name:'Siti Rahma',nik:'1271000000000001',jenis:JENIS[2],ket:'Pengajuan KUR warung',st:2,note:'',log:[[0,n-300*m],[1,n-200*m],[2,n-90*m]]},{id:'SRT-0002',u:'ani',name:'Ani Lubis',nik:'1271000000000002',jenis:JENIS[0],ket:'Syarat beasiswa',st:3,note:'',log:[[0,n-900*m],[3,n-600*m]]},{id:'SRT-0003',u:'rudi',name:'Rudi Hasibuan',nik:'1271000000000003',jenis:JENIS[1],ket:'Keringanan biaya sekolah',st:0,note:'',log:[[0,n-20*m]]}],
tickets:[{no:1,u:'ani',name:'Ani Lubis',lay:JENIS[0],st:'selesai',t:n-50*m},{no:2,u:'rudi',name:'Rudi Hasibuan',lay:JENIS[3],st:'dipanggil',t:n-30*m},{no:3,u:'dewi',name:'Dewi Sinaga',lay:'Konsultasi',st:'menunggu',t:n-10*m}]}}
function load(){try{const r=localStorage.getItem(K);if(r)return JSON.parse(r)}catch(e){}return mem||seed()}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}mem=db}
function toast(t){clearTimeout(toastT);document.querySelectorAll('.toast').forEach(e=>e.remove());const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;document.body.append(e);toastT=setTimeout(()=>e.remove(),2600)}
const lab=t=>'A-'+pad(t.no),active=()=>db.tickets.find(t=>t.u===me.u&&t.st!=='selesai'),serving=()=>db.tickets.find(t=>t.st==='dipanggil'),waiting=()=>db.tickets.filter(t=>t.st==='menunggu');
const steps=s=>`<div class="steps" aria-label="Tahap ${FLOW[s]}">${FLOW.map((_,i)=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div>`;
function tabs(list){return`<div class="tabs" role="tablist">${list.map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-tab="${k}">${l}</button>`).join('')}</div>`}
function loginView(reg){return`<section class="hero"><div><h1>Urus surat dan antre dari rumah.</h1><p>Ajukan surat keterangan, ambil nomor antrean, dan pantau statusnya tanpa menunggu berjam-jam di kantor kelurahan.</p>
<div class="ticket" style="max-width:300px;margin-top:20px"><small>Sedang dilayani</small><div class="num">A-${pad(serving()?serving().no:0)}</div><small>${waiting().length} orang menunggu</small></div></div>
<form class="card" id="${reg?'regf':'logf'}"><h2>${reg?'Daftar sebagai warga':'Masuk'}</h2>
${reg?'<label for="nm">Nama lengkap</label><input id="nm" required>':''}
<label for="us">Nama pengguna</label><input id="us" required autocomplete="username"><label for="pw">Kata sandi</label><input id="pw" type="password" required minlength="6" autocomplete="current-password">
<p id="err" class="mute" role="alert" style="color:var(--bad)"></p><div class="row"><button class="p">${reg?'Daftar':'Masuk'}</button><button type="button" data-act="${reg?'tologin':'toreg'}">${reg?'Sudah punya akun':'Buat akun warga'}</button></div>
<p class="hint">Akun demo: warga / warga123 atau petugas / petugas123</p></form></section>`}
function wargaView(){const t=active(),pos=t?waiting().findIndex(x=>x.no===t.no):-1;
if(tab==='q')return`<div class="grid"><div class="ticket"><small>Sedang dilayani</small><div class="num">A-${pad(serving()?serving().no:0)}</div><small>${waiting().length} orang menunggu</small></div>
<div class="card">${t?`<h3>Nomor antrean Anda</h3><div class="num" style="color:var(--brand);font-size:64px">${lab(t)}</div><p>${esc(t.lay)}</p><p>${t.st==='dipanggil'?'<span class="pill ok">Giliran Anda. Silakan ke loket.</span>':`Di depan Anda: <b>${pos}</b> orang. Perkiraan tunggu: <b>${pos*6} menit</b>.`}</p><button class="d" data-act="cancel">Batalkan antrean</button>`:
`<h3>Ambil nomor antrean</h3><label for="lay">Keperluan</label><select id="lay">${[...JENIS,'Konsultasi'].map(j=>`<option>${j}</option>`).join('')}</select><p><button class="p" data-act="take">Ambil nomor</button></p>`}</div></div>`;
if(tab==='new')return`<form class="card" id="sf"><h2>Ajukan surat</h2><label for="jn">Jenis surat</label><select id="jn">${JENIS.map(j=>`<option>${j}</option>`).join('')}</select>
<label for="nk">NIK (16 digit)</label><input id="nk" inputmode="numeric" maxlength="16" required><label for="kt">Keperluan</label><textarea id="kt" rows="3" required></textarea>
<label for="fl">Dokumen pendukung (KTP/KK)</label><input id="fl" type="file" accept="image/*,.pdf"><p id="err" role="alert" style="color:var(--bad)"></p><button class="p">Kirim pengajuan</button></form>`;
const mine=db.letters.filter(l=>l.u===me.u).reverse();return mine.length?mine.map(letterCard).join(''):'<div class="card"><p>Belum ada pengajuan. Buka tab Ajukan surat untuk memulai.</p></div>'}
function letterCard(l,adm){const rej=l.st<0;return`<article class="card"><div class="row"><div><h3>${esc(l.jenis)}</h3><span class="mute">${l.id} · ${esc(l.name)} · ${esc(l.ket)}</span></div><span class="pill ${rej?'bad':l.st===3?'ok':''}">${rej?'Ditolak':FLOW[l.st]}</span></div>
${rej?'':steps(l.st)}<p class="mute">${l.log.map(([s,t])=>`${s<0?'Ditolak':FLOW[s]} ${fmt(t)}`).join(' → ')}</p>${l.note?`<p><b>Catatan petugas:</b> ${esc(l.note)}</p>`:''}
${l.st===3?'<p>Surat siap. Ambil di loket dengan membawa KTP asli.</p>':''}
${adm&&l.st>=0&&l.st<3?`<input data-note="${l.id}" placeholder="Catatan untuk pemohon (wajib jika menolak)" aria-label="Catatan"><p class="row" style="justify-content:flex-start"><button class="p" data-adv="${l.id}">Lanjut ke ${FLOW[l.st+1]}</button><button class="d" data-rej="${l.id}">Tolak</button></p>`:''}</article>`}
function petugasView(){if(tab==='q'){const s=serving(),w=waiting();return`<div class="grid"><div class="ticket"><small>Sedang dilayani</small><div class="num">A-${pad(s?s.no:0)}</div><small>${s?esc(s.name)+' · '+esc(s.lay):'Belum ada'}</small><p><button class="p" data-act="next" style="background:var(--ink);border-color:var(--ink);color:var(--bg)">Panggil berikutnya</button></p></div>
<div class="card"><h3>Menunggu (${w.length})</h3>${w.length?w.map(t=>`<p class="row"><span><b>${lab(t)}</b> ${esc(t.name)}</span><span class="mute">${esc(t.lay)}</span></p>`).join(''):'<p class="mute">Antrean kosong.</p>'}</div></div>`}
if(tab==='req'){const l=[...db.letters].reverse();return l.length?l.map(x=>letterCard(x,1)).join(''):'<div class="card">Belum ada permohonan.</div>'}
const L=db.letters,done=L.filter(l=>l.st===3).length,tk=db.tickets.length;
return`<div class="grid"><div class="card"><span class="mute">Total permohonan</span><div class="stat">${L.length}</div></div><div class="card"><span class="mute">Surat selesai</span><div class="stat">${done}</div><div class="bar"><b style="width:${L.length?done/L.length*100:0}%"></b></div></div>
<div class="card"><span class="mute">Nomor antrean hari ini</span><div class="stat">${tk}</div></div><div class="card"><span class="mute">Ditolak</span><div class="stat">${L.filter(l=>l.st<0).length}</div></div></div>
<div class="card"><h3>Permohonan per tahap</h3>${FLOW.map((f,i)=>{const c=L.filter(l=>l.st===i).length;return`<p class="row"><span>${f}</span><b>${c}</b></p><div class="bar"><b style="width:${L.length?c/L.length*100:0}%"></b></div>`}).join('')}</div>`}
function render(){$('#who').innerHTML=me?`${esc(me.name)} <button data-act="out">Keluar</button>`:'';
if(!me){$('#app').innerHTML=loginView(window._reg);return}
const w=me.role==='warga';if(!tab)tab=w?'q':'sum';
$('#app').innerHTML=tabs(w?[['q','Antrean'],['new','Ajukan surat'],['my','Surat saya']]:[['sum','Ringkasan'],['q','Antrean'],['req','Permohonan']])+(w?wargaView():petugasView())}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.id==='reset'){db=seed();save();me=null;tab='';render();return}
if(b.dataset.tab){tab=b.dataset.tab;render();return}
const a=b.dataset.act;if(a==='toreg'||a==='tologin'){window._reg=a==='toreg';render()}
if(a==='out'){me=null;tab='';render()}
if(a==='take'){if(active())return;db.tickets.push({no:db.tickets.reduce((m,t)=>Math.max(m,t.no),0)+1,u:me.u,name:me.name,lay:$('#lay').value,st:'menunggu',t:Date.now()});save();render();toast('Nomor antrean berhasil diambil')}
if(a==='cancel'){db.tickets=db.tickets.filter(t=>t!==active());save();render();toast('Antrean dibatalkan')}
if(a==='next'){const s=serving();if(s)s.st='selesai';const n=waiting()[0];if(n)n.st='dipanggil';save();render();toast(n?'Memanggil '+lab(n):'Tidak ada antrean')}
const id=b.dataset.adv||b.dataset.rej;if(id){const l=db.letters.find(x=>x.id===id),note=document.querySelector(`[data-note="${id}"]`).value.trim();
if(b.dataset.rej){if(!note){toast('Tulis alasan penolakan');return}l.st=-1;l.log.push([-1,Date.now()])}else{l.st++;l.log.push([l.st,Date.now()])}l.note=note||l.note;save();render();toast('Status diperbarui')}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.id,err=$('#err');
if(f==='logf'){const u=db.users.find(x=>x.u===$('#us').value.trim()&&x.p===$('#pw').value);if(!u){err.textContent='Nama pengguna atau kata sandi salah.';return}me=u;tab='';render()}
if(f==='regf'){const us=$('#us').value.trim();if(db.users.some(x=>x.u===us)){err.textContent='Nama pengguna sudah dipakai.';return}me={u:us,p:$('#pw').value,role:'warga',name:$('#nm').value.trim()};db.users.push(me);save();tab='';window._reg=false;render();toast('Akun dibuat')}
if(f==='sf'){const nik=$('#nk').value;if(!/^\d{16}$/.test(nik)){err.textContent='NIK harus 16 digit angka.';return}
db.letters.push({id:'SRT-'+String(db.letters.length+1).padStart(4,'0'),u:me.u,name:me.name,nik,jenis:$('#jn').value,ket:$('#kt').value.trim(),st:0,note:'',log:[[0,Date.now()]]});save();tab='my';render();toast('Pengajuan terkirim')}});
addEventListener('storage',e=>{if(e.key===K){db=load();if(me)me=db.users.find(u=>u.u===me.u)||me;render()}});
render();
</script></body></html>
