<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AntriSurat</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f6;--sf:#fff;--ink:#0f1e1c;--mute:#5b6b68;--line:#d6dfdd;--brand:#0f6b5e;--on:#fff;--amb:#f2b705;--ambi:#2a2000;--bad:#b42318;--ok:#067647;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1514;--sf:#142220;--ink:#e8f1ef;--mute:#9bb0ac;--line:#27403c;--brand:#3fc2ac;--on:#05211c;--bad:#ff8a7a;--ok:#5fd59a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1514;--sf:#142220;--ink:#e8f1ef;--mute:#9bb0ac;--line:#27403c;--brand:#3fc2ac;--on:#05211c;--bad:#ff8a7a;--ok:#5fd59a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;line-height:1.1;margin:0}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px;flex-wrap:wrap}
.logo{font:800 22px "Bricolage Grotesque",sans-serif;color:var(--brand)}
.who{font-size:14px;color:var(--mute);display:flex;gap:10px;align-items:center}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--sf);border-radius:8px;padding:9px 14px;font-weight:600}
button:disabled{opacity:.6;cursor:wait}
button.p{background:var(--brand);color:var(--on);border-color:var(--brand)}
button.d{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sf)}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;color:var(--mute);white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--brand)}
.ticket{position:relative;background:var(--amb);color:var(--ambi);border-radius:14px;padding:22px 26px;text-align:center}
.ticket:before,.ticket:after{content:"";position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
.ticket:before{left:-11px}.ticket:after{right:-11px}
.ticket small{display:block;font-weight:600;opacity:.8}
.num{font:800 clamp(56px,14vw,96px)/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.bad{color:var(--bad);border-color:var(--bad)}
.mute{color:var(--mute);font-size:14px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.steps{display:flex;gap:4px;margin:10px 0 4px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--brand)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.bar b{display:block;height:100%;background:var(--brand)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:9;max-width:90vw;text-align:center}
.hero{display:grid;gap:24px;grid-template-columns:1.1fr .9fr;align-items:center;margin-top:8px}
@media(max-width:720px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(32px,6vw,52px);margin-bottom:12px}
.stat{font:800 34px "Bricolage Grotesque",sans-serif}
.hint{font-size:13px;color:var(--mute);margin-top:10px}
.err{color:var(--bad);min-height:1.5em}
@media(prefers-reduced-motion:no-preference){.ticket{animation:pop .5s ease-out}@keyframes pop{from{transform:rotate(-3deg) scale(.96)}}}
</style></head><body><div class="wrap">
<header><div class="logo">AntriSurat</div><div class="who" id="who"></div></header>
<main id="app"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ====== ISI DUA BARIS INI (Supabase > Project Settings > API) ====== */
const SUPABASE_URL='https://dmfzookvgdlkhwhwdgjh.supabase.co';
const SUPABASE_KEY='sb_publishable_NeBpE6kN_cmwOTarz-lMrQ_V6k0-Gk_';
/* ================================================================== */

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const JENIS=['Surat Keterangan Domisili','Surat Keterangan Tidak Mampu','Surat Keterangan Usaha','Pengantar KTP/KK','Pengantar Nikah'],FLOW=['Diajukan','Diverifikasi','Diproses','Selesai'];
const pad=n=>String(n).padStart(3,'0'),fmt=t=>new Date(t).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const lab=t=>'A-'+pad(t.no),today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'});
const CONFIGURED=!SUPABASE_URL.includes('GANTI')&&!SUPABASE_KEY.includes('GANTI');
const sb=CONFIGURED?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const EMPTY_Q={serving:0,waiting:0,ahead:0,mine:null};
let me=null,tab='',reg=false,last='',toastT,S={letters:[],tickets:[],q:EMPTY_Q};

function toast(t){clearTimeout(toastT);document.querySelectorAll('.toast').forEach(e=>e.remove());const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;document.body.append(e);toastT=setTimeout(()=>e.remove(),3000)}
const steps=s=>`<div class="steps" aria-label="Tahap ${FLOW[s]}">${FLOW.map((_,i)=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div>`;
function tabs(list){return`<div class="tabs" role="tablist">${list.map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-tab="${k}">${l}</button>`).join('')}</div>`}

/* ---------- Data ---------- */
async function refresh(force){
  if(!sb)return;
  try{
    const q=await sb.rpc('queue_status');if(q.error)throw q.error;
    let letters=[],tickets=[];
    if(me){
      const l=await sb.from('letters').select('*').order('id',{ascending:false});if(l.error)throw l.error;letters=l.data;
      if(me.role==='petugas'){const t=await sb.from('tickets').select('*').eq('day',today()).order('no');if(t.error)throw t.error;tickets=t.data}
    }
    const snap=JSON.stringify([me&&me.id,q.data,letters,tickets]);
    if(!force&&snap===last)return;
    last=snap;S={letters,tickets,q:q.data||EMPTY_Q};render();
  }catch(e){console.error(e);if(force)toast('Gagal memuat data: '+(e.message||e))}
}
async function enter(user){
  const {data:p,error}=await sb.from('profiles').select('*').eq('id',user.id).single();
  if(error||!p){toast('Profil tidak ditemukan');await sb.auth.signOut();return}
  me={id:user.id,name:p.name,role:p.role};tab='';await refresh(true);
}

/* ---------- Tampilan ---------- */
function setupView(){return`<section class="card"><h2>Konfigurasi belum diisi</h2><p>Buka <b>index.html</b>, lalu isi <b>SUPABASE_URL</b> dan <b>SUPABASE_KEY</b> di bagian atas skrip dengan nilai dari Supabase &gt; Project Settings &gt; API.</p></section>`}
function loginView(){const q=S.q;return`<section class="hero"><div><h1>Urus surat dan antre dari rumah.</h1><p>Ajukan surat keterangan, ambil nomor antrean, dan pantau statusnya tanpa menunggu berjam-jam di kantor kelurahan.</p>
<div class="ticket" style="max-width:300px;margin-top:20px"><small>Sedang dilayani</small><div class="num">A-${pad(q.serving)}</div><small>${q.waiting} orang menunggu</small></div></div>
<form class="card" id="${reg?'regf':'logf'}"><h2>${reg?'Daftar sebagai warga':'Masuk'}</h2>
${reg?'<label for="nm">Nama lengkap</label><input id="nm" required maxlength="80" autocomplete="name">':''}
<label for="us">Email</label><input id="us" type="email" required autocomplete="email"><label for="pw">Kata sandi</label><input id="pw" type="password" required minlength="6" autocomplete="${reg?'new-password':'current-password'}">
<p id="err" class="err" role="alert"></p><div class="row"><button class="p" id="go">${reg?'Daftar':'Masuk'}</button><button type="button" data-act="${reg?'tologin':'toreg'}">${reg?'Sudah punya akun':'Buat akun warga'}</button></div></form></section>`}
function wargaView(){const q=S.q,t=q.mine;
if(tab==='q')return`<div class="grid"><div class="ticket"><small>Sedang dilayani</small><div class="num">A-${pad(q.serving)}</div><small>${q.waiting} orang menunggu</small></div>
<div class="card">${t?`<h3>Nomor antrean Anda</h3><div class="num" style="color:var(--brand);font-size:64px">${lab(t)}</div><p>${esc(t.lay)}</p><p>${t.st==='dipanggil'?'<span class="pill ok">Giliran Anda. Silakan ke loket.</span>':`Di depan Anda: <b>${q.ahead}</b> orang. Perkiraan tunggu: <b>${q.ahead*6} menit</b>.`}</p>${t.st==='menunggu'?'<button class="d" data-act="cancel">Batalkan antrean</button>':''}`:
`<h3>Ambil nomor antrean</h3><label for="lay">Keperluan</label><select id="lay">${[...JENIS,'Konsultasi'].map(j=>`<option>${j}</option>`).join('')}</select><p><button class="p" data-act="take">Ambil nomor</button></p>`}</div></div>`;
if(tab==='new')return`<form class="card" id="sf"><h2>Ajukan surat</h2><label for="jn">Jenis surat</label><select id="jn">${JENIS.map(j=>`<option>${j}</option>`).join('')}</select>
<label for="nk">NIK (16 digit)</label><input id="nk" inputmode="numeric" maxlength="16" required><label for="kt">Keperluan</label><textarea id="kt" rows="3" required maxlength="300"></textarea>
<p id="err" class="err" role="alert"></p><button class="p" id="go">Kirim pengajuan</button></form>`;
return S.letters.length?S.letters.map(l=>letterCard(l)).join(''):'<div class="card"><p>Belum ada pengajuan. Buka tab Ajukan surat untuk memulai.</p></div>'}
function letterCard(l,adm){const rej=l.st<0;return`<article class="card"><div class="row"><div><h3>${esc(l.jenis)}</h3><span class="mute">${esc(l.code)} · ${esc(l.name)} · ${esc(l.ket)}</span></div><span class="pill ${rej?'bad':l.st===3?'ok':''}">${rej?'Ditolak':FLOW[l.st]}</span></div>
${rej?'':steps(l.st)}<p class="mute">${l.log.map(([s,t])=>`${s<0?'Ditolak':FLOW[s]} ${fmt(t)}`).join(' → ')}</p>${l.note?`<p><b>Catatan petugas:</b> ${esc(l.note)}</p>`:''}
${l.st===3?'<p>Surat siap. Ambil di loket dengan membawa KTP asli.</p>':''}
${adm&&l.st>=0&&l.st<3?`<input data-note="${l.id}" placeholder="Catatan untuk pemohon (wajib jika menolak)" aria-label="Catatan" maxlength="300"><p class="row" style="justify-content:flex-start"><button class="p" data-adv="${l.id}">Lanjut ke ${FLOW[l.st+1]}</button><button class="d" data-rej="${l.id}">Tolak</button></p>`:''}</article>`}
function petugasView(){
if(tab==='q'){const s=S.tickets.find(t=>t.st==='dipanggil'),w=S.tickets.filter(t=>t.st==='menunggu');return`<div class="grid"><div class="ticket"><small>Sedang dilayani</small><div class="num">A-${pad(s?s.no:0)}</div><small>${s?esc(s.name)+' · '+esc(s.lay):'Belum ada'}</small><p><button class="p" data-act="next" style="background:var(--ink);border-color:var(--ink);color:var(--bg)">Panggil berikutnya</button></p></div>
<div class="card"><h3>Menunggu (${w.length})</h3>${w.length?w.map(t=>`<p class="row"><span><b>${lab(t)}</b> ${esc(t.name)}</span><span class="mute">${esc(t.lay)}</span></p>`).join(''):'<p class="mute">Antrean kosong.</p>'}</div></div>`}
if(tab==='req')return S.letters.length?S.letters.map(x=>letterCard(x,1)).join(''):'<div class="card">Belum ada permohonan.</div>';
const L=S.letters,done=L.filter(l=>l.st===3).length,pc=n=>L.length?n/L.length*100:0;
return`<div class="grid"><div class="card"><span class="mute">Total permohonan</span><div class="stat">${L.length}</div></div><div class="card"><span class="mute">Surat selesai</span><div class="stat">${done}</div><div class="bar"><b style="width:${pc(done)}%"></b></div></div>
<div class="card"><span class="mute">Nomor antrean hari ini</span><div class="stat">${S.tickets.length}</div></div><div class="card"><span class="mute">Ditolak</span><div class="stat">${L.filter(l=>l.st<0).length}</div></div></div>
<div class="card"><h3>Permohonan per tahap</h3>${FLOW.map((f,i)=>{const c=L.filter(l=>l.st===i).length;return`<p class="row"><span>${f}</span><b>${c}</b></p><div class="bar"><b style="width:${pc(c)}%"></b></div>`}).join('')}</div>`}
function render(){
  $('#who').innerHTML=me?`${esc(me.name)} <button data-act="out">Keluar</button>`:'';
  if(!CONFIGURED){$('#app').innerHTML=setupView();return}
  if(!me){$('#app').innerHTML=loginView();return}
  const w=me.role==='warga';if(!tab)tab=w?'q':'sum';
  $('#app').innerHTML=tabs(w?[['q','Antrean'],['new','Ajukan surat'],['my','Surat saya']]:[['sum','Ringkasan'],['q','Antrean'],['req','Permohonan']])+(w?wargaView():petugasView());
}

/* ---------- Aksi ---------- */
async function act(b,fn){b.disabled=true;try{await fn()}catch(e){toast(e.message||'Terjadi kesalahan')}finally{b.disabled=false}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!sb)return;
  if(b.dataset.tab){tab=b.dataset.tab;render();return}
  const a=b.dataset.act;
  if(a==='toreg'||a==='tologin'){reg=a==='toreg';render();return}
  if(a==='out')return act(b,async()=>{await sb.auth.signOut();me=null;tab='';S={letters:[],tickets:[],q:EMPTY_Q};await refresh(true)});
  if(a==='take')return act(b,async()=>{const r=await sb.rpc('take_ticket',{p_lay:$('#lay').value});if(r.error)throw r.error;await refresh(true);toast('Nomor antrean berhasil diambil')});
  if(a==='cancel')return act(b,async()=>{
    const d=await sb.from('tickets').delete().eq('user_id',me.id).eq('st','menunggu').eq('day',today());if(d.error)throw d.error;await refresh(true);toast('Antrean dibatalkan')});
  if(a==='next')return act(b,async()=>{const r=await sb.rpc('next_ticket');if(r.error)throw r.error;await refresh(true);const s=S.tickets.find(t=>t.st==='dipanggil');toast(s?'Memanggil '+lab(s):'Tidak ada antrean')});
  const id=b.dataset.adv||b.dataset.rej;
  if(id)return act(b,async()=>{
    const l=S.letters.find(x=>String(x.id)===id),note=document.querySelector(`[data-note="${id}"]`).value.trim(),rej=!!b.dataset.rej;
    if(rej&&!note){toast('Tulis alasan penolakan');return}
    const st=rej?-1:l.st+1,log=[...l.log,[st,Date.now()]];
    const r=await sb.from('letters').update({st,log,note:note||l.note}).eq('id',l.id);if(r.error)throw r.error;
    await refresh(true);toast('Status diperbarui')});
});
document.addEventListener('submit',e=>{e.preventDefault();if(!sb)return;const f=e.target.id,err=$('#err'),b=$('#go');err.textContent='';
  act(b,async()=>{
    if(f==='logf'){const r=await sb.auth.signInWithPassword({email:$('#us').value.trim(),password:$('#pw').value});
      if(r.error){err.textContent=r.error.message.includes('Email not confirmed')?'Email belum dikonfirmasi. Cek kotak masuk Anda.':'Email atau kata sandi salah.';return}
      await enter(r.data.user)}
    if(f==='regf'){const r=await sb.auth.signUp({email:$('#us').value.trim(),password:$('#pw').value,options:{data:{name:$('#nm').value.trim()}}});
      if(r.error){err.textContent=r.error.message;return}
      if(r.data.session){await enter(r.data.user);toast('Akun dibuat')}
      else{reg=false;render();toast('Akun dibuat. Cek email untuk konfirmasi, lalu masuk.')}}
    if(f==='sf'){const nik=$('#nk').value;if(!/^\d{16}$/.test(nik)){err.textContent='NIK harus 16 digit angka.';return}
      const r=await sb.from('letters').insert({user_id:me.id,nik,jenis:$('#jn').value,ket:$('#kt').value.trim(),log:[[0,Date.now()]]});
      if(r.error){err.textContent=r.error.message;return}
      tab='my';await refresh(true);toast('Pengajuan terkirim')}
  })});

/* ---------- Mulai ---------- */
(async()=>{
  render();if(!sb)return;
  const {data:{session}}=await sb.auth.getSession();
  if(session)await enter(session.user);else await refresh(true);
  setInterval(()=>{if(!document.hidden)refresh()},5000);
})();
</script></body></html>
